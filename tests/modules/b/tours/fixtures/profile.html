<!doctype html>
<!--
  عينة جولات T-3.5 (TEST-TOUR-01): صفحة ملف شخصي (octo-dev) بالعناصر التي تحملها توقيعات القاموس لجولتي «الصفحة الشخصية» و«إنشاء مستودع»: الأدوار والتسميات كما
  تثبتها مطابقة البطاقة (b/card/match). مكتوبة لهذه المرحلة؛ ليست لقطة حية. بالزر الحقيقي «Edit profile» وروابط المتابعين ليُقاس أن الجولة لا تنقر عليها.

<html lang="en" data-color-mode="auto">
<head><meta charset="utf-8"><meta name="user-login" content="octo-dev"><title>octo-dev (Octo Dev)</title></head>
<body class="logged-in env-production">
  <header role="banner"><a href="/" aria-label="Homepage">GitHub</a></header>
  <main id="js-pjax-container">
    <aside>
      <button type="button" id="edit-profile">Edit profile</button>
      <a href="/octo-dev?tab=followers" id="followers"><span class="Counter">12</span> followers</a>
      <a href="/octo-dev?tab=following" id="following"><span class="Counter">3</span> following</a>
    </aside>
    <nav aria-label="User profile"><a href="/octo-dev?tab=repositories" role="tab">Repositories</a></nav>
    <section aria-label="Pinned" id="pinned"><ol><li><a href="/octo-dev/demo">demo</a></li></ol></section>
    <table aria-label="contributions in the last year" id="contrib"><tbody><tr><td>1</td></tr></tbody></table>
    <div id="repos-toolbar"><a href="/new" id="new-repo" class="btn">New</a></div>
    <form action="/octo-dev/hidden-form" method="post"><button type="submit" id="submit-trap">Save</button></form>
  </main>
</body>
</html>
