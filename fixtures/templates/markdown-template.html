<html lang="en" data-color-mode="auto">
<head><meta charset="utf-8"><title>Comparing main...feature · octo/demo</title></head>
<body class="logged-in env-production">
<main id="js-repo-pjax-container">
  <form id="new-pr-form" action="/octo/demo/pulls" method="post" class="js-new-pull-request">
    <input type="text" name="pull_request[title]" aria-label="Title" value="Add feature">
    <markdown-toolbar for="pull_request_body"><div class="toolbar-group"><button type="button" data-md-button aria-label="Bold">B</button></div></markdown-toolbar>

    <label><input type="checkbox" name="pull_request[allow_edits]" checked> Allow edits by maintainers</label>
    <button type="submit" id="submit-pr">Create pull request</button>
  </form>
